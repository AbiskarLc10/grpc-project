syntax = "proto3";

enum Genre {
    FANTASY = 0;
    CLASSICS = 1;
    DYSTOPIAN = 2;
    HISTORICAL_FICTION = 3;
    MYSTERY = 4;
    CONTEMPORARY_FICTION = 5;
    ADVENTURE = 6;
}

message Author {
    string id = 1;
    string name = 2;
    string email = 3;
    string date_of_birth = 4;
    Genre genre = 5;
    optional string profileImage = 6;
}


message Book {
    string id = 1;
    string bookName = 2;
    Genre genre = 3;
    string authorId = 4;
    string published_date = 5;
    oneof author_info{

        string authorName = 6;
    }
}