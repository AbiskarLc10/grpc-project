# .github/workflows/test.yml

name: Run test programs workflows

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
         echo "changing the directory to server and installing dependencies"
         cd server
         npm install

      - name: Test to run a function
        run: npm run test
